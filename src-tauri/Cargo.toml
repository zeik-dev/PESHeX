[package]
name = "peshex"
version = "1.0.0"
description = "PESHeX (Pokémon Essential HeX): editor visual de partidas de Pokémon Essentials"
license = "MIT"
authors = ["zeik-dev"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [".", "crates/rxdriver"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "peshex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Nombre del ejecutable que se distribuye (PESHeX.exe); debe coincidir con
# `mainBinaryName` de tauri.conf.json.
name = "PESHeX"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
rxdriver = { path = "crates/rxdriver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
