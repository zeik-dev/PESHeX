name: release-windows

# Release de PESHeX para Windows: un .zip con todo lo necesario para ejecutarlo (sin instalador).
#
#   * push de un tag vX.Y.Z (o vX.Y.Z-sufijo)       -> compila, prueba, empaqueta y PUBLICA el Release
#   * push a `development` con "release: X.Y.Z" como primera linea del mensaje del commit
#                                                    -> igual; el Release crea el tag vX.Y.Z sobre ese commit
#   * push a `development` con "[winbuild]" en el mensaje
#                                                    -> compila, prueba y empaqueta, pero NO publica (ensayo)
#   * workflow_dispatch                              -> igual que el ensayo (solo si este archivo esta en la rama por defecto)
on:
  push:
    branches: [development]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar, probar y empaquetar (Windows)
    # Un build de Windows tarda y cuesta minutos: en `development` solo se hace si se pide.
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/') ||
      startsWith(github.event.head_commit.message, 'release:') ||
      contains(github.event.head_commit.message, '[winbuild]')
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Versión y tag
        id: ver
        shell: bash
        run: |
          tag_arg=()
          [[ "$GITHUB_REF_TYPE" == "tag" ]] && tag_arg=(--tag "$GITHUB_REF_NAME")
          node scripts/check-version.mjs "${tag_arg[@]}" | tee -a "$GITHUB_OUTPUT"

      - name: Dependencias
        run: npm ci

      - name: TypeScript y pruebas de la UI
        run: |
          npx tsc --noEmit
          npm test
          npm run test:release

      - name: Ruby portátil (RubyInstaller, SHA256 fijado)
        shell: pwsh
        run: ./scripts/setup-ruby.ps1

      - name: Pruebas del driver con el Ruby que se distribuye
        shell: pwsh
        run: |
          $bin = Join-Path $PWD 'src-tauri\resources\ruby\bin'
          $env:PATH = "$bin;$env:PATH"
          ruby -v
          ruby -Itest scripts/run_ruby_tests.rb

      - name: Compilar PESHeX.exe
        run: npx tauri build --no-bundle

      - name: Firmar (solo si hay certificado en los secretos)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -File src-tauri/target/release/PESHeX.exe

      - name: Empaquetar el zip
        shell: pwsh
        run: node scripts/package-release.mjs --exe src-tauri/target/release/PESHeX.exe --version "${{ steps.ver.outputs.version }}" --out release-out

      - name: Prueba de humo del zip (ruta con espacios y ñ, PATH reducido)
        shell: pwsh
        run: ./scripts/smoke-release.ps1 -Zip "release-out/PESHeX-${{ steps.ver.outputs.version }}-windows-x64.zip" -Version "${{ steps.ver.outputs.version }}"

      - name: Atestación de procedencia (solo repositorios públicos)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-out/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: peshex-windows-x64
          path: |
            release-out/*.zip
            release-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar el Release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: peshex-windows-x64
          path: dist-release

      - name: Verificar la versión, el tag y las huellas
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "version no valida: $VERSION"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]] || { echo "el tag $GITHUB_REF_NAME no coincide con la version $VERSION"; exit 1; }
          else
            first_line="${HEAD_MESSAGE%%$'\n'*}"
            [[ "$first_line" == "release: $VERSION" || "$first_line" == "release: v$VERSION" ]] || {
              echo "el mensaje del commit ('$first_line') no pide el release de la version $VERSION"; exit 1; }
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          cd dist-release
          ls -la
          sha256sum -c SHA256SUMS.txt
          test "$(ls PESHeX-*-windows-x64.zip | wc -l)" = 1
          test -f "PESHeX-${VERSION}-windows-x64.zip"

      - name: Crear (o actualizar) el Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          files=(dist-release/PESHeX-*-windows-x64.zip dist-release/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-ejecucion del mismo commit: se reponen los archivos. Si el tag apunta a OTRO commit, se aborta.
            tagged="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
            [[ "$tagged" == "$GITHUB_SHA" ]] || { echo "ya existe $TAG en otro commit ($tagged): sube la version"; exit 1; }
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "PESHeX ${VERSION}" \
              --notes-file .github/release-notes.md \
              "${flags[@]}"
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "  \(.name) \(.size) bytes")'
